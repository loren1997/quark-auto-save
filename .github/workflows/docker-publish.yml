name: Anonymous v3.10 discovery verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/probe_v310_live.py registry
      - run: python scripts/probe_v310_live.py nia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-v310-search-results
          path: test-results/v310-live-*
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for mode in ('registry','nia'):
              result=json.loads(Path(f'test-results/v310-live-{mode}.json').read_text())
              print(json.dumps(result,ensure_ascii=False))
              assert result['success'], result
              if mode == 'nia':
                  assert result['missing_episode_verified'], result
                  assert result['selected_missing_episodes'] == [2], result
          PY
