name: Test and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TAG=${{ github.ref_name }}
      - name: Verify container startup on both architectures
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          smoke_container=
          trap 'if [ -n "$smoke_container" ]; then docker logs "$smoke_container"; docker rm -f "$smoke_container"; fi' EXIT
          for platform in linux/amd64 linux/arm64; do
            smoke_container=$(docker run --detach --platform "$platform" \
              --publish 127.0.0.1:5005:5005 \
              --env WEBUI_PASSWORD=ci-smoke-only \
              "$IMAGE_REPOSITORY:sha-${GITHUB_SHA:0:7}")
            curl --fail --silent --show-error --retry 20 --retry-all-errors \
              --retry-delay 2 --retry-max-time 45 http://127.0.0.1:5005/login > /dev/null
            docker logs "$smoke_container"
            docker rm -f "$smoke_container"
            smoke_container=
          done
