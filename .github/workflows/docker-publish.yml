name: Anonymous discovery verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/probe_v39_live.py 0
      - run: python scripts/probe_v39_live.py 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-search-results
          path: test-results/v39-full-live-*
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for index in (0,1):
              result=json.loads(Path(f'test-results/v39-full-live-{index}.json').read_text())
              print(json.dumps(result,ensure_ascii=False))
              assert result['success'], result
              assert {1,2,3,4,5} <= set(result['episodes']), result
              assert result['missing_episode_verified'], result
              assert result['selected_missing_episodes'] == [2], result
          PY
